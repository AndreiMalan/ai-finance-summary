[project]
name = "statbrief"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime dependencies. MUST mirror requirements.txt exactly (enforced by tests/unit/test_packaging.py):
# Vercel's uv-based Python builder installs from pyproject.toml when present, so an empty list
# here would deploy with no dependencies at all. requirements.txt stays for pip/local dev.
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pydantic-settings==2.16.1",
    "itsdangerous==2.2.0",
    "argon2-cffi==25.1.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "httpx==0.28.1",
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres==3.2.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "vercel-blob==0.5.0",
    "langchain-core==1.7.0",
    "langchain-text-splitters==1.1.3",
    "pypdf==6.21.2",
    "langchain-openai==1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statbrief = ["storage/migrations/*.sql", "web/templates/*.html", "web/static/**/*", "ingest/data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["live: hits a real public API; skipped unless RUN_LIVE_TESTS=1"]
